<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资政大模型 — 智能体</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f5f7fa; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1f3a5f; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: bold; }
  header span { font-size: 12px; font-weight: normal; opacity: .8; margin-left: 12px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 78%; margin-bottom: 14px; padding: 12px 16px; border-radius: 10px; line-height: 1.7; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .user { background: #1f3a5f; color: #fff; margin-left: auto; }
  .bot { background: #fff; border: 1px solid #e3e8ef; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .meta { font-size: 12px; color: #8a94a6; margin-top: 8px; }
  .src { background: #f0f4f9; border-radius: 6px; padding: 6px 10px; margin: 4px 0; font-size: 12px; color: #456; }
  .err { color: #c0392b; }
  #inputbar { display: flex; gap: 10px; padding: 14px 20px; background: #fff; border-top: 1px solid #e3e8ef; }
  #mode { padding: 10px; border: 1px solid #cfd6e0; border-radius: 8px; background: #fff; }
  #input { flex: 1; padding: 10px 14px; border: 1px solid #cfd6e0; border-radius: 8px; font-size: 14px; outline: none; }
  #input:focus { border-color: #1f3a5f; }
  #send { padding: 10px 26px; background: #1f3a5f; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #send:hover { background: #2a4d7a; }
  #send:disabled { background: #9aa8bd; cursor: not-allowed; }
  .tip { text-align: center; color: #8a94a6; font-size: 12px; padding: 8px; }
</style>
</head>
<body>
<header>资政大模型 <span>自研 DC-RAG 智能体（本地嵌入 + 本地知识库 + LLM 生成）</span></header>
<div id="chat">
  <div class="tip">可咨询：如"深圳2025年GDP增长目标是多少？"、"罗湖区城市更新成效"、"广东省2024年城镇新增就业目标"</div>
</div>
<div id="inputbar">
  <select id="mode" aria-label="任务模式">
    <option value="qa">政策问答</option>
    <option value="summary">材料摘要</option>
    <option value="report">报告草稿</option>
    <option value="briefing">情报简报</option>
  </select>
  <input id="input" placeholder="请输入你的问题..." autocomplete="off">
  <button id="send">发送</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const mode = document.getElementById('mode');

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function ask() {
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  send.disabled = true;
  addMsg(q, 'user');
  const loading = addMsg('思考中...', 'bot');
  try {
    const resp = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q, mode: mode.value})
    });
    const data = await resp.json();
    loading.remove();
    if (data.error) {
      addMsg(data.error, 'bot err');
      return;
    }
    const bot = addMsg(data.answer, 'bot');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = '增强查询：' + (data.enhanced || '—') + '｜任务：' + (data.mode || 'qa');
    meta.appendChild(document.createElement('br'));
    meta.appendChild(document.createTextNode('来源：'));
    bot.appendChild(meta);
    (data.sources || []).forEach(s => {
      const d = document.createElement('div');
      d.className = 'src';
      const evidence = s.evidence_chunks > 1 ? '，证据块 ' + s.evidence_chunks : '';
      d.textContent = '📄 ' + (s.doc_title || s.doc_id) + '（' + (s.region || '未知地区') + '，'
        + (s.year || '未知年份') + '，相似度 ' + s.score + evidence + '）';
      meta.appendChild(d);
    });
  } catch (e) {
    loading.remove();
    addMsg('请求失败：' + e.message, 'bot err');
  } finally {
    send.disabled = false;
  }
}

send.onclick = ask;
input.onkeydown = (e) => { if (e.key === 'Enter') ask(); };
</script>
</body>
</html>
